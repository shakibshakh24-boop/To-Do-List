
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>
        <p>Organize your tasks for the day!</p>

        <!-- Add Task Form -->
        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task"
                aria-label="New task"
                required
            >
            <button type="submit">Add Task</button>
        </form>

        <!-- Filter Buttons -->
        <div class="filters">
            <button type="button" id="all-btn" class="selected">
                All
            </button>

            <button type="button" id="active-btn">
                Active
            </button>

            <button type="button" id="completed-btn">
                Completed
            </button>
        </div>

        <!-- Task List -->
        <ul id="task-list"></ul>

    </div>

    <script src="script.js"></script>
</body>
</html>
